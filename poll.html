<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; manifest-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f2f3f5">
  <meta name="robots" content="noindex,nofollow">
  <title>School Election · Voting</title>
  <link rel="stylesheet" href="poll.css">
  <script src="poll.js" defer></script>
</head>
<body>
  <main class="poll-shell">
    <header class="poll-brand"><span class="poll-mark">S</span><div><strong id="school-name">School</strong><small>Independent election ballot</small></div></header>
    <section class="poll-hero"><p class="eyebrow">SCHOOL ELECTION</p><h1 id="poll-title">Loading ballot…</h1><p id="poll-description">Use the shared voting link supplied by the school.</p><div class="poll-meta" id="poll-meta"></div></section>
    <section class="poll-panel" id="poll-panel"><div class="loading-state">Checking the voting link…</div></section>
    <footer class="poll-footer"><span>School election ballot</span><span>Keep your vote private. Do not share your selections.</span></footer>
  </main>
</body>
</html>
